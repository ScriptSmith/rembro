name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIGLANG_VERSION: "0.16.0"
  CARGO_ZIGBUILD_VERSION: "0.24.1"
  TARGETS: >-
    x86_64:x86_64-unknown-linux-musl
    aarch64:aarch64-unknown-linux-musl
    armv7:armv7-unknown-linux-musleabihf

jobs:
  # A tag that doesn't match Cargo.toml stops here, before anything is built or released.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  rembro:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet "ziglang==$ZIGLANG_VERSION" "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - run: cargo test
      - name: Build
        run: |
          mkdir -p out
          for t in $TARGETS; do
            cargo zigbuild --release --target "${t#*:}"
            cp "target/${t#*:}/release/rembro" "out/rembro-${t%%:*}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rembro
          path: out/

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo test
      - name: Build
        run: |
          mkdir -p out
          for arch in aarch64 x86_64; do
            cargo build --release --target "$arch-apple-darwin"
            cp "target/$arch-apple-darwin/release/rembro" "out/rembro-macos-$arch"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rembro-macos
          path: out/

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: Build
        shell: bash
        env:
          # Links the C runtime in, so the build needs no Visual C++ redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release
          mkdir -p out
          cp target/release/rembro.exe out/rembro-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rembro-windows
          path: out/

  waypipe:
    needs: version
    runs-on: ubuntu-latest
    env:
      WAYPIPE_RUST_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev pkg-config python3-venv
      - run: echo "WAYPIPE_BUILD_DIR=$RUNNER_TEMP/waypipe" >> "$GITHUB_ENV"
      - name: Build
        run: |
          for t in $TARGETS; do
            scripts/build-waypipe.sh "${t#*:}" "out/waypipe-${t%%:*}"
          done
      - name: Collect source and licenses
        run: scripts/waypipe-source.sh "$WAYPIPE_BUILD_DIR" out
      - uses: actions/upload-artifact@v4
        with:
          name: waypipe
          path: out/

  release:
    needs: [rembro, macos, windows, waypipe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Each archive holds rembro for its system and architecture, plus the Linux agents it
      # copies into targets. The Linux archives also hold the waypipe builds; macOS and
      # Windows have no Wayland sessions to forward windows to, so theirs do not.
      - name: Package
        run: |
          cd dist
          chmod +x rembro-x86_64 rembro-aarch64 rembro-armv7 waypipe-x86_64 waypipe-aarch64 waypipe-armv7 \
            rembro-macos-aarch64 rembro-macos-x86_64
          for t in $TARGETS; do
            arch=${t%%:*}
            pkg=rembro-$arch-linux
            mkdir -p "$pkg/licenses"
            cp "rembro-$arch" "$pkg/rembro"
            for o in $TARGETS; do
              [ "${o%%:*}" = "$arch" ] || cp "rembro-${o%%:*}" "$pkg/"
              cp "waypipe-${o%%:*}" "$pkg/"
            done
            cp -r ../README.md ../docs ../LICENSE-MIT ../LICENSE-APACHE "$pkg/"
            cp licenses/* "$pkg/licenses/"
            tar -czf "$pkg.tar.gz" "$pkg"
          done
          for host in macos:aarch64 macos:x86_64 windows:x86_64; do
            os=${host%%:*} arch=${host#*:}
            pkg=rembro-$arch-$os
            mkdir -p "$pkg"
            case $os in
            windows) cp "rembro-windows-$arch.exe" "$pkg/rembro.exe" ;;
            *) cp "rembro-macos-$arch" "$pkg/rembro" ;;
            esac
            for o in $TARGETS; do
              cp "rembro-${o%%:*}" "$pkg/"
            done
            cp -r ../README.md ../docs ../LICENSE-MIT ../LICENSE-APACHE "$pkg/"
            case $os in
            windows) zip -qr "$pkg.zip" "$pkg" ;;
            *) tar -czf "$pkg.tar.gz" "$pkg" ;;
            esac
          done
          sha256sum rembro-x86_64 rembro-aarch64 rembro-armv7 waypipe-x86_64 waypipe-aarch64 waypipe-armv7 \
            rembro-*-linux.tar.gz rembro-*-macos.tar.gz rembro-x86_64-windows.zip waypipe-source.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The waypipe binaries are modified builds of waypipe 0.11.3 (GPL-3.0-or-later);"
            echo "see licenses/waypipe-NOTICE.md in each archive. waypipe-source.tar.gz is their source."
          } > notes.md
          cd dist
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes-file ../notes.md \
            rembro-x86_64 rembro-aarch64 rembro-armv7 waypipe-x86_64 waypipe-aarch64 waypipe-armv7 \
            rembro-*-linux.tar.gz rembro-*-macos.tar.gz rembro-x86_64-windows.zip waypipe-source.tar.gz SHA256SUMS

  # A cargo-installed rembro downloads its agents from the GitHub release of its own version,
  # so the crate goes out once that release exists. One-time setup: in the crate's settings on
  # crates.io, add a trusted publisher for ScriptSmith/rembro, workflow release.yml and
  # environment crates-io.
  crates-io:
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
